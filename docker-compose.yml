services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-household_chores}
      POSTGRES_USER: ${POSTGRES_USER:-household_chores}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-household_chores}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
